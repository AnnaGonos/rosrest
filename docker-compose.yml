
services:
  # для локальной разработки
  postgres_dev:
    image: postgres:16-alpine
    container_name: rosrest_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_DEV_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_DEV_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DEV_NAME:-rosrest_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - rosrest_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_DEV_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rosrest_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - rosrest_network
    profiles:
      - tools
    depends_on:
      - postgres_dev

  redis:
    image: redis:7-alpine
    container_name: rosrest_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - rosrest_network


  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: rosrest_api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3002}
      DB_PROD_HOST: ${DB_PROD_HOST:-postgres_dev}
      DB_PROD_PORT: ${DB_PROD_PORT:-5432}
      DB_PROD_USER: ${DB_PROD_USER:-postgres}
      DB_PROD_PASSWORD: ${DB_PROD_PASSWORD}
      DB_PROD_NAME: ${DB_PROD_NAME:-rosrest_dev}
      DB_PROD_SSL: ${DB_PROD_SSL:-false}
      REDIS_URL: ${REDIS_URL:-redis://rosrest_redis:6379}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_RATE_MS: ${MAIL_RATE_MS:-2000}
      USE_SIMPLE_EMAIL: ${USE_SIMPLE_EMAIL:-false}
      SITE_URL: ${SITE_URL}
      API_URL: ${API_URL}
      FILE_BASE_URL: ${VITE_FILES_BASE_URL:-https://document.rosrest.com}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - postgres_dev
      - redis
    networks:
      - rosrest_network
    volumes:
      - uploads_data:/app/uploads

  nginx-document:
    image: nginx:latest
    container_name: rosrest_nginx_document
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./apps/api/nginx.document.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/admin.rosrest.com/dist:/var/www/admin.rosrest.com/dist:ro
      - /var/www/test.rosrest.com/dist:/var/www/test.rosrest.com/dist:ro
      - uploads_data:/app/uploads
    networks:
      - rosrest_network
    

  postgres_backup:
    image: prodrigestivill/postgres-backup-local:latest
    container_name: rosrest_postgres_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${DB_PROD_HOST:-postgres_dev}
      POSTGRES_PORT: ${DB_PROD_PORT:-5432}
      POSTGRES_DB: ${DB_PROD_NAME:-rosrest_dev}
      POSTGRES_USER: ${DB_PROD_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PROD_PASSWORD}
      SCHEDULE: "0 3 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./db_backups:/backups
    depends_on:
      - postgres_dev
    networks:
      - rosrest_network


volumes:
  postgres_dev_data:
    driver: local
  pgadmin_data:
    driver: local
  uploads_data:
    driver: local

networks:
  rosrest_network:
    driver: bridge
