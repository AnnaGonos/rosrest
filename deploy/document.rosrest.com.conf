server {
    listen 443 ssl;
    server_name document.rosrest.com;
    root /var/www/document.rosrest.com;
    index index.html;
    client_max_body_size 50m;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 302 https://cdn-icons-png.freepik.com/512/15547/15547385.png;
    }
    location = /favicon.png {
        access_log off;
        log_not_found off;
        return 302 https://cdn-icons-png.freepik.com/512/15547/15547385.png;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        alias /var/www/rosrest/uploads/;
        autoindex on;
        add_header Access-Control-Allow-Origin *;
        add_header Link '<https://cdn-icons-png.freepik.com/512/15547/15547385.png>; rel="icon"' always;
    }

    ssl_certificate /etc/letsencrypt/live/document.rosrest.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/document.rosrest.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = document.rosrest.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name document.rosrest.com;
    return 404;
}
