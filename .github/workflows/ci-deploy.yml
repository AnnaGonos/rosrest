name: CI and Deploy

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install root deps
        run: npm ci

      - name: Install site deps
        working-directory: apps/site
        run: npm ci

      - name: Build site (includes sitemap prebuild)
        working-directory: apps/site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Start ssh-agent and add key
        # Use a more stable tag to avoid a post-job cleanup bug with Node runtimes
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Remote deploy (create .env + docker compose)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_ON_SERVER: ${{ secrets.DEPLOY_PATH }}
          BRANCH: main
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_FILES_BASE_URL: ${{ secrets.VITE_FILES_BASE_URL }}
          DB_PROD_HOST: ${{ secrets.DB_PROD_HOST }}
          DB_PROD_PORT: ${{ secrets.DB_PROD_PORT }}
          DB_PROD_USER: ${{ secrets.DB_PROD_USER }}
          DB_PROD_PASSWORD: ${{ secrets.DB_PROD_PASSWORD }}
          DB_PROD_NAME: ${{ secrets.DB_PROD_NAME }}
          DB_PROD_SSL: ${{ secrets.DB_PROD_SSL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          ssh -o StrictHostKeyChecking=no ${USER}@${HOST} << 'EOF'
            set -e
            mkdir -p ${PATH_ON_SERVER}
            cd ${PATH_ON_SERVER}
            # backup existing .env
            if [ -f .env ]; then cp .env .env.bak.$(date +%s); fi

            # create .env file from secrets
            cat > .env <<EOT
NODE_ENV=production
PORT=3002

DB_HOST=${DB_PROD_HOST}
DB_PORT=${DB_PROD_PORT}
DB_USER=${DB_PROD_USER}
DB_PASSWORD='${DB_PROD_PASSWORD}'
DB_NAME=${DB_PROD_NAME}
DB_SSL=${DB_PROD_SSL}

REDIS_URL='${REDIS_URL}'

MAIL_HOST='${MAIL_HOST}'
MAIL_PORT=${MAIL_PORT}
MAIL_USER='${MAIL_USER}'
MAIL_PASSWORD='${MAIL_PASSWORD}'
MAIL_FROM='${MAIL_FROM}'

SITE_URL='https://rosrest.com'
API_URL='https://api.rosrest.com'
ADMIN_URL='https://admin.rosrest.com'
VITE_API_URL='${VITE_API_URL}'
VITE_FILES_BASE_URL='${VITE_FILES_BASE_URL}'
EOT

            # pull latest code and restart containers
            git fetch --all
            git reset --hard origin/${BRANCH}
            docker compose pull || true
            docker compose build --no-cache api
            docker compose up -d --remove-orphans
            sudo nginx -t && sudo systemctl reload nginx || true
          EOF
